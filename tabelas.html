<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas Combinadas</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/weather-icons/2.0.10/css/weather-icons.min.css">
    <style>
        table {
            width: 50%;
            min-width: 300px;
            margin: 20px auto;
            border-collapse: collapse;
            text-align: center;
            font-family: "Times New Roman", Times, serif;
            font-size: 12px;
        }
        th, td {
            border: 1px solid black;
            padding: 5px;
        }
        th {
            background-color: rgb(168, 218, 213);
        }
        tr:nth-child(odd) {
            background-color: rgb(240,248,255);
        }
        tr:hover {
            background-color: rgb(168, 218, 213);
        }
        td:first-child {
            text-align: left;
        }
    </style>
</head>
<body>

<table>
    <tr>
        <th>Dia</th>
        <th>Tempo</th>
        <th>Mínima</th>
        <th>Máxima</th>
    </tr>
    <tr>
        <td>Domingo</td>
        <td><i class="wi wi-day-cloudy"></i></td>
        <td>27°</td>
        <td>32°</td>
    </tr>
    <tr>
        <td>Segunda</td>
        <td><i class="wi wi-day-sunny"></i></td>
        <td>27°</td>
        <td>32°</td>
    </tr>
    <tr>
        <td>Terça</td>
        <td><i class="wi wi-day-rain"></i></td>
        <td>27°</td>
        <td>32°</td>
    </tr>
    <tr>
        <td>Quarta</td>
        <td><i class="wi wi-day-lightning"></i></td>
        <td>27°</td>
        <td>32°</td>
    </tr>
    <tr>
        <td>Quinta</td>
        <td><i class="wi wi-day-windy"></i></td>
        <td>27°</td>
        <td>32°</td>
    </tr>
    <tr>
        <td>Sexta</td>
        <td><i class="wi wi-cloudy"></i></td>
        <td>27°</td>
        <td>32°</td>
    </tr>
    <tr>
        <td>Sábado</td>
        <td><i class="wi wi-day-cloudy"></i></td>
        <td>27°</td>
        <td>32°</td>
    </tr>
</table>

<table>
    <tr>
        <th></th>
        <th>Linguagem de Marcação</th>
        <th>Fundamentos da Computação</th>
        <th>Algoritmos</th>
    </tr>
    <tr>
        <td>Ada Lovelace</td>
        <td>9.0</td>
        <td>10.0</td>
        <td>9.0</td>
    </tr>
    <tr>
        <td>Grace Hopper</td>
        <td>9.0</td>
        <td>9.0</td>
        <td>10.0</td>
    </tr>
    <tr>
        <td>Alan Turing</td>
        <td>9.0</td>
        <td>9.0</td>
        <td>10.0</td>
    </tr>
    <tr>
        <td>Tim Berners-Lee</td>
        <td>10.0</td>
        <td>9.0</td>
        <td>9.0</td>
    </tr>
</table>

</body>
</html>
